[package]
name = "zhizi-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Platform-neutral 知字 host: the core plus 顺手·知字 ranking and quality records, for the Windows (and later Linux) shells."

[lib]
crate-type = ["rlib"]

[features]
default = ["librime", "model"]
librime = ["agent-ime-core/librime"]
# 顺手·知字 through ONNX Runtime, loaded at run time from the onnxruntime library
# shipped next to the host (Windows onnxruntime.dll, macOS libonnxruntime.dylib).
model = ["dep:ort"]
# Test builds: zhizi-upload sends quality records hourly (the release build omits it).
upload = ["dep:ureq"]

[dependencies]
agent-ime-core = { path = "../core/agent-ime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"], optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }

[build-dependencies]
cc = "1"

[[bin]]
name = "zhizi-upload"
path = "src/bin/zhizi-upload.rs"
required-features = ["upload"]
