[package]
name = "zhizi-tsf"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.61.2"
zhizi-host = { path = "../../host" }
windows = { version = "0.61.3", features = [
 "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
 "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading",
 "Win32_System_SystemServices", "Win32_Security", "Win32_UI_TextServices",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
 "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Memory"
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
panic = "abort"
strip = "debuginfo"
