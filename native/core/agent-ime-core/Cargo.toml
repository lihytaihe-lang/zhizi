[package]
name = "agent-ime-core"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "agent_ime_core"
crate-type = ["rlib", "staticlib"]

[features]
default = []
librime = []
diagnostic-no-owner-raw-hits = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
